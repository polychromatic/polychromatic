# Translations for the man pages.
#
# The English pages are written in scdoc. po4a extracts the strings into
# message catalogues under po/, and reassembles a translated scdoc file for
# each language, which is then compiled by scripts/build-man-pages.sh
#
# To refresh the catalogues after editing an English page, run that script;
# it invokes po4a when the command is available.

[po_directory] po

[po4a_alias:scdoc] text opt:"-o markdown"
[options] --keep 0 --msgid-bugs-address https://github.com/polychromatic/polychromatic/issues

[type:scdoc] polychromatic-cli.1.scd $lang:.build/$lang/polychromatic-cli.1.scd
[type:scdoc] polychromatic-controller.1.scd $lang:.build/$lang/polychromatic-controller.1.scd
[type:scdoc] polychromatic-helper.1.scd $lang:.build/$lang/polychromatic-helper.1.scd
[type:scdoc] polychromatic-tray-applet.1.scd $lang:.build/$lang/polychromatic-tray-applet.1.scd
